[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gianthost"
version = "0.1.0"
description = "GiantHost: NCLDV host prediction inference pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "NCLDV Host Project Team"}
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "torch>=2.0",
  "biopython>=1.81",
  "scikit-learn>=1.2",
  "pyarrow>=12.0",
  "pyhmmer>=0.10"
]

[project.scripts]
gianthost = "gianthost.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["gianthost*", "src*"]

[tool.setuptools.package-data]
gianthost = ["taxonomy_lineage.json"]
